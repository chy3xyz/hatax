<!-- layout: app-shell -->
<html>
<head>
  <title>AI 客服</title>
</head>
<body>
<div id="page-content" x-data="aiChat" x-cloak class="pt-28 p-6 h-[calc(100vh-7rem)] flex flex-col animate-fade-in"
     :class="$store.app.sidebarOpen ? 'lg:ml-64' : 'lg:ml-0'">

  <nav class="flex items-center gap-1 text-sm text-gray-500 dark:text-gray-400 mb-4 flex-shrink-0" aria-label="Breadcrumb">
    <a href="/admin/dashboard.html" class="hover:text-primary transition-colors">首页</a>
    <span class="text-gray-300">/</span>
    <span class="text-gray-700 dark:text-gray-200 font-medium">AI 客服</span>
  </nav>

  <div class="mb-3 flex flex-wrap items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
    <span class="rounded-full bg-gray-100 px-2.5 py-1 dark:bg-gray-800" x-text="llm ? '模式：站内汇聚 + 大模型' : '模式：站内内容汇聚（未配置 AI_API_KEY）'"></span>
    <span class="text-gray-400">与前台悬浮客服共用 /api/ai</span>
  </div>

  <div class="flex-1 flex flex-col bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden min-h-0">
    <div class="flex items-center gap-3 px-5 py-3 border-b border-gray-200 dark:border-gray-700 flex-shrink-0">
      <div class="w-9 h-9 rounded-lg bg-stone-900 dark:bg-white flex items-center justify-center">
        <svg class="w-5 h-5 text-white dark:text-stone-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h8M8 14h5M21 12a9 9 0 1 1-3.2-6.9L21 5v7z"></path></svg>
      </div>
      <div>
        <div class="text-sm font-semibold">社区客服试聊</div>
        <div class="text-xs" :class="llm ? 'text-green-500' : 'text-amber-500'" x-text="llm ? '大模型已启用' : '仅汇聚模式'"></div>
      </div>
      <button @click="clearChat" class="ml-auto p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition-colors text-gray-400 hover:text-gray-600" title="清空对话">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
      </button>
    </div>

    <div id="chat-messages" class="flex-1 overflow-y-auto p-5 space-y-4" x-ref="messages">
      <template x-for="(msg, i) in messages" :key="i">
        <div :class="msg.role === 'user' ? 'flex justify-end' : 'flex gap-3'">
          <div x-show="msg.role === 'assistant'" class="w-8 h-8 rounded-lg bg-stone-900 dark:bg-white flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white dark:text-stone-900" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h8M8 14h5M21 12a9 9 0 1 1-3.2-6.9L21 5v7z"></path></svg>
          </div>
          <div :class="msg.role === 'user'
            ? 'max-w-[75%] px-4 py-2.5 bg-primary text-white rounded-2xl rounded-br-md'
            : 'max-w-[75%] px-4 py-2.5 bg-gray-100 dark:bg-gray-800 rounded-2xl rounded-bl-md'">
            <div x-show="msg.loading" class="flex gap-1 py-1">
              <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0s"></span>
              <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0.15s"></span>
              <span class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay:0.3s"></span>
            </div>
            <div x-show="!msg.loading" class="text-sm whitespace-pre-wrap" x-text="msg.content"></div>
            <template x-if="!msg.loading && msg.sources && msg.sources.length">
              <ul class="mt-2 space-y-1 border-t border-gray-200/80 pt-2 dark:border-gray-700">
                <template x-for="(s, si) in msg.sources" :key="si">
                  <li>
                    <a :href="s.url" target="_blank" class="text-xs text-primary hover:underline">
                      [<span x-text="s.typeLabel"></span>] <span x-text="s.title"></span>
                    </a>
                  </li>
                </template>
              </ul>
            </template>
            <div class="text-[10px] opacity-50 mt-1" x-text="msg.time" x-show="!msg.loading"></div>
          </div>
        </div>
      </template>
    </div>

    <div class="px-5 py-3 border-t border-gray-200 dark:border-gray-700 flex-shrink-0">
      <div class="flex gap-2">
        <textarea x-model="input" @keydown.enter.prevent="if (!$event.shiftKey) sendMessage()"
          placeholder="输入问题，Enter 发送…"
          rows="1" class="flex-1 px-4 py-2.5 border rounded-xl dark:bg-gray-800 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-primary/30 focus:border-primary transition-colors resize-none"
          :disabled="sending"
          @input="$el.style.height='auto'; $el.style.height=$el.scrollHeight+'px'"></textarea>
        <button @click="sendMessage()" :disabled="sending || !input.trim()"
          class="px-4 py-2.5 bg-primary text-white rounded-xl hover:bg-primary/90 disabled:opacity-40 transition-colors flex items-center gap-1.5 flex-shrink-0">
          <svg x-show="!sending" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
          <svg x-show="sending" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { apiUrl } from '/src/api-base.js'

Alpine.data('aiChat', () => ({
  messages: [
    {
      role: 'assistant',
      content: '你好！这里试聊前台同一套社区客服：先检索博客 / 论坛 / 任务 / 课程 / 活动，再可选大模型总结。',
      time: '刚刚',
      loading: false,
      sources: [],
    },
  ],
  input: '',
  sending: false,
  llm: false,

  async init() {
    try {
      const res = await fetch(apiUrl('/api/ai/status'))
      const json = await res.json()
      this.llm = Boolean(json?.data?.llm)
    } catch {
      this.llm = false
    }
  },

  async sendMessage() {
    const text = this.input.trim()
    if (!text || this.sending) return

    this.messages.push({ role: 'user', content: text, time: this._now(), loading: false, sources: [] })
    this.input = ''
    this.sending = true
    const loadingMsg = { role: 'assistant', content: '', time: '', loading: true, sources: [] }
    this.messages.push(loadingMsg)
    this.$nextTick(() => this._scrollBottom())

    try {
      const history = this.messages
        .filter((m) => !m.loading && m.content)
        .slice(0, -1)
        .slice(-6)
        .map((m) => ({ role: m.role, content: m.content }))
      const res = await fetch(apiUrl('/api/ai/chat'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ message: text, history }),
      })
      const json = await res.json()
      if (!res.ok || json.code !== 0) throw new Error(json.msg || `HTTP ${res.status}`)
      loadingMsg.content = json.data.reply || '暂无回复'
      loadingMsg.sources = json.data.sources || []
      this.llm = Boolean(json.data.llm)
    } catch (err) {
      loadingMsg.content = `请求失败：${err.message || err}`
      loadingMsg.sources = []
    } finally {
      loadingMsg.time = this._now()
      loadingMsg.loading = false
      this.sending = false
      this.$nextTick(() => this._scrollBottom())
    }
  },

  clearChat() {
    this.messages = [
      { role: 'assistant', content: '对话已清空。有什么新的问题吗？', time: this._now(), loading: false, sources: [] },
    ]
  },

  _now() {
    const d = new Date()
    return `${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`
  },

  _scrollBottom() {
    const el = this.$refs.messages
    if (el) el.scrollTop = el.scrollHeight
  },
}))
</script>
</body>
</html>
